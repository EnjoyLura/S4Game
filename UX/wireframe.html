<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>王国守望 · UX交互线稿 v0.1</title>
<style>
:root{
  --wood:#3a2e23;--wood2:#57432c;--parch:#e9dcb5;--gold:#f2b23e;--gold2:#c98a1a;
  --green:#7fb841;--orange:#ef9d3c;--red:#e5484d;--blue:#4fa8ff;--purple:#b96bff;
  --ink:#241c12;--line:rgba(255,255,255,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#15181c;color:#e8e4da;display:flex;flex-direction:column;overflow:hidden}
#top{height:48px;background:#1d2126;border-bottom:1px solid #2c323a;display:flex;align-items:center;gap:14px;padding:0 14px;flex:none}
#top h1{font-size:15px;color:var(--gold)}
#top .tg{display:flex;align-items:center;gap:5px;font-size:12px;color:#aab;cursor:pointer;user-select:none}
#top .tg input{accent-color:var(--gold)}
#top .sp{flex:1}
#top .ver{font-size:11px;color:#667}
#wrap{flex:1;display:flex;min-height:0}
#nav{width:196px;flex:none;background:#1a1e23;border-right:1px solid #2c323a;overflow-y:auto;padding:10px 8px}
#nav .grp{font-size:11px;color:#778;margin:10px 6px 4px}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#cdd2d8;font-size:13px;padding:8px 10px;border-radius:8px;cursor:pointer}
#nav button:hover{background:#242a31}
#nav button.on{background:var(--gold);color:#241c12;font-weight:700}
#nav button .en{display:block;font-size:10px;color:inherit;opacity:.6}
#stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:22px;background:
 radial-gradient(1200px 600px at 50% -100px,#232a33,#15181c)}
.phone{width:375px;height:667px;flex:none;position:relative;background:#000;border-radius:22px;
 outline:10px solid #262b31;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
.phone.grid::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:99;
 background-image:linear-gradient(rgba(120,200,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,200,255,.08) 1px,transparent 1px);
 background-size:25px 25px}
.phone.safe::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:98;
 border-top:22px solid rgba(229,72,77,.14);border-bottom:17px solid rgba(229,72,77,.14)}
.screen{position:absolute;inset:0;background:#101418;overflow:hidden}
/* 占位组件 */
.ph{position:absolute;border:1.5px dashed var(--line);background:rgba(130,140,150,.16);border-radius:5px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;z-index:5}
.ph b{font-size:9px;color:#fff;text-shadow:0 1px 2px #000;text-align:center;line-height:1.25;padding:0 3px;font-weight:600}
.ph span{font-size:7.5px;font-family:Consolas,monospace;color:#ffe9a8;text-shadow:0 1px 2px #000}
.ph em{font-size:7px;font-style:normal;font-family:Consolas,monospace;color:rgba(255,255,255,.6)}
body.noanno .ph span,body.noanno .ph em{display:none}
.ph.circ{border-radius:50%}
.ph.dark{background:rgba(20,24,30,.72)}
.ph.gold{background:rgba(242,178,62,.14);border-color:var(--gold)}
.ph.red{background:rgba(229,72,77,.12);border-color:var(--red)}
.ph.blue{background:rgba(79,168,255,.10);border-color:var(--blue)}
.ph.purple{background:rgba(185,107,255,.10);border-color:var(--purple)}
.ph.green{background:rgba(127,184,65,.10);border-color:var(--green)}
.txt{position:absolute;z-index:6;display:flex;align-items:center;justify-content:center;color:#fff;
 text-shadow:0 1px 2px rgba(0,0,0,.8);text-align:center;line-height:1.2}
.dim{position:absolute;inset:0;background:rgba(6,8,12,.68);z-index:20}
.dim.red{background:rgba(80,10,12,.72)}
.ovl{position:absolute;inset:0;z-index:30}
.ovl .dim{z-index:0}
.bar{position:absolute;height:6px;background:rgba(255,255,255,.12);border-radius:3px;z-index:6;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:3px}
/* 右侧说明 */
#notes{width:352px;flex:none;background:#1a1e23;border-left:1px solid #2c323a;overflow-y:auto;padding:14px}
#notes h2{font-size:15px;color:var(--gold);margin-bottom:8px}
#notes h3{font-size:12px;color:#8fc; margin:12px 0 5px;border-left:3px solid var(--gold);padding-left:6px}
#notes p,#notes li{font-size:12px;line-height:1.65;color:#c8cdd4}
#notes ul{padding-left:16px}
#notes table{width:100%;border-collapse:collapse;margin:6px 0;font-size:11px}
#notes th{background:#242a31;color:#9ab;text-align:left;padding:4px 6px;font-weight:600}
#notes td{border-top:1px solid #2c323a;padding:4px 6px;color:#c8cdd4;vertical-align:top}
#notes code{font-family:Consolas,monospace;background:#242a31;padding:0 4px;border-radius:4px;color:#ffe9a8;font-size:10.5px}
/* 资源清单页 */
#stage .sheet{width:860px;background:#1a1e23;border:1px solid #2c323a;border-radius:14px;padding:20px 24px;margin:0 auto}
.sheet h2{color:var(--gold);font-size:17px;margin-bottom:4px}
.sheet p{font-size:12.5px;color:#c8cdd4;line-height:1.7}
.sheet table{width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0 18px}
.sheet th{background:#242a31;color:#9ab;text-align:left;padding:5px 8px;position:sticky;top:0}
.sheet td{border-top:1px solid #2c323a;padding:5px 8px;color:#c8cdd4}
.sheet td code{font-family:Consolas,monospace;color:#ffe9a8;font-size:10.5px}
.sheet .gh{color:#8fc;font-size:13px;margin:14px 0 2px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(255,255,255,.25)}
</style>
</head>
<body class="">
<header id="top">
  <h1>王国守望 · UX 交互线稿</h1>
  <label class="tg"><input type="checkbox" id="tgAnno" checked>资产标注</label>
  <label class="tg"><input type="checkbox" id="tgSafe">安全区</label>
  <label class="tg"><input type="checkbox" id="tgGrid">网格(50px)</label>
  <div class="sp"></div>
  <div class="ver">设计分辨率 750×1334 · 线稿半比例 375×667 · v0.1</div>
</header>
<div id="wrap">
  <nav id="nav"></nav>
  <main id="stage"></main>
  <aside id="notes"></aside>
</div>
<script>
/* ============ 工具 ============ */
function ph(id,l,t,w,h,o){o=o||{};var s="left:"+l/2+"px;top:"+t/2+"px;width:"+w/2+"px;height:"+h/2+"px;"+(o.css||"");
  return '<div class="ph '+(o.cls||"")+'" style="'+s+'"><b>'+(o.txt||"&nbsp;")+'</b><span>'+id+'</span><em>'+w+"×"+h+'</em></div>';}
function txt(l,t,w,h,inner,cls,css){var s="left:"+l/2+"px;top:"+t/2+"px;width:"+w/2+"px;height:"+h/2+"px;"+(css||"");
  return '<div class="txt '+(cls||"")+'" style="'+s+'">'+inner+'</div>';}
function bar(l,t,w,pct,color){return '<div class="bar" style="left:'+l/2+'px;top:'+t/2+'px;width:'+w/2+'px"><i style="width:'+pct+'%;'+(color?'background:'+color:'')+'"></i></div>';}
function E(sel,html){document.querySelector(sel).innerHTML=html;}

/* ============ 屏幕定义 ============ */
var SCREENS={};

/* ---- S1 战斗HUD ---- */
SCREENS.battle={name:"① 关卡战斗 HUD",en:"Battle HUD",render:function(){
  var s='';
  s+=ph("bg_ch1_forest",0,0,750,1334,{cls:"dark",css:"background:rgba(46,64,52,.30);border-color:rgba(120,180,110,.4)",txt:"战场背景 · 第1章 腐朽森林(占位)"});
  /* 顶部: 刘海屏遮挡预留区 */
  s+=ph("safe_notch",255,0,240,64,{cls:"red",css:"border-radius:0 0 16px 16px;border-top:none",txt:"刘海遮挡预留区(禁放UI)"});
  /* 顶部栏(刘海下方) */
  s+=ph("ui_topbar",16,100,718,70,{cls:"dark",txt:""});
  s+=ph("ui_icon_pause",30,105,60,60,{cls:"gold",txt:"⏸"});
  s+=txt(110,114,140,40,"00:36",'','font-size:11px;opacity:.75');
  s+=txt(250,110,300,50,"<b style='color:#ffe08a;font-size:14px'>1-1 腐朽森林·前哨</b>",'','font-size:12px');
  s+=ph("ui_wave_pill",560,105,150,60,{txt:"波次 3/10"});
  /* 顶部经验条 + Lv徽章骑条居中 */
  s+=ph("ui_bar_exp",30,176,690,12,{txt:""});
  s+=bar(30,176,690,35,"#4fa8ff");
  s+=ph("ui_lv_badge",330,166,90,32,{cls:"dark",css:"border-radius:10px",txt:"Lv.2"});
  /* 预警横幅位(仅大波/BOSS) */
  s+=ph("ui_banner_warn",115,226,520,72,{cls:"gold",txt:"敌军大部队来袭！(仅狂潮/BOSS时显示)"});
  s+=ph("ui_boss_hp",175,304,400,36,{cls:"red",txt:"BOSS头顶血条(仅BOSS)"});
  /* 左列: 调试/倍速/统计 */
  s+=txt(24,210,120,30,"FPS:60",'','font-size:10px;color:#7ee787');
  s+=ph("ui_btn_speed",24,240,60,60,{cls:"gold",txt:"X1<br>倍速"});
  s+=ph("ui_btn_stats",24,320,60,60,{cls:"gold",txt:"📊<br>伤害统计"});
  /* 右下角: 大招按钮区(4×1 右对齐纵列,各英雄独立充能) */
  for(var i=0;i<4;i++){
    var x=636,y=740+i*100;
    s+=ph("hero_{id}_ult_btn",x,y,90,90,{cls:"gold circ",txt:"大招"+(i+1)+"<br>68%"});
    s+=ph("ui_ring_charge",x,y,90,90,{cls:"circ",css:"background:transparent",txt:""});
  }
  s+=txt(546,712,180,22,"大招区(4×1·独立充能)",'','font-size:8.5px;color:#89f');
  /* 反馈气泡 P2(左列) */
  s+=ph("ui_icon_chat",24,400,60,60,{cls:"dark",txt:"💬 P2"});
  /* 防线工事 + 4英雄站位(防线后) + 头顶普攻/技能图标 */
  s+=ph("bg_line_ch1",0,1180,750,154,{cls:"dark",css:"background:rgba(90,74,50,.30)",txt:"防线工事 · 沙包/木栅+盾徽(王国保卫战风)"});
  var hxs=[95,240,385,530];
  for(var j=0;j<4;j++){
    var x=hxs[j];
    s+=ph("hero_aila_battle",x,1170,100,120,{cls:"dark",txt:"英雄"+(j+1)+"<br>立绘占位"});
    s+=ph("hero_{id}_atk_icon",x+1,1162,46,46,{cls:"gold circ",txt:"普攻"});
    s+=ph("hero_{id}_skill_icon",x+53,1162,46,46,{cls:"blue circ",txt:"技能"});
    s+=ph("hero_{id}_skill_cd",x+53,1162,46,46,{cls:"blue circ",css:"background:transparent",txt:""});
  }
  /* 防线耐久条: 条内居中耐久值 + 右侧百分比 + 盾值胶囊(右→左覆盖) */
  s+=ph("ui_bar_hp",55,1138,640,20,{txt:""});
  s+=bar(55,1138,640,90);
  s+=txt(55,1138,640,20,"900/1000",'','font-size:9px;font-weight:700');
  s+=ph("ui_bar_shield",567,1136,128,24,{cls:"blue",css:"border-radius:12px;background:rgba(79,168,255,.45)",txt:"100"});
  s+=txt(698,1136,48,24,"90%",'','font-size:10px;color:#9fe08a');
  s+=txt(331,810,100,30,"×4英雄",'','font-size:9px;color:#89f');
  return s;},
 notes:{
  layout:["顶部预留刘海遮挡区(高64px，禁放任何UI)；顶栏在其下方：暂停(左) / 关卡名(中) / 波次胶囊(右，波次N/M)。",
   "顶栏下方为全队共享经验条(690×12，蓝色填充)，Lv 徽章(90×32)骑在经验条正中央。",
   "左列：FPS(仅Debug包) / 倍速(1x↔2x) / 伤害统计 / 反馈气泡(P2)；无左下角计数栈(耐久/金币/击杀计数已裁剪，金币自动收取只计不显)。",
   "普攻/技能图标(金/蓝，各46×46，技能带CD环)左右并排，位于耐久条正下方(y1162，与条底留4px)，压住英雄头顶形成锚定、不遮挡耐久条；英雄站位在防线工事之后(防线后一点)。",
   "防线耐久条(640×20)：条内居中显示耐久值(900/1000)，条右侧显示百分比(90%)；盾值以蓝色胶囊从右向左覆盖耐久条，宽度=盾值/耐久上限比例，盾值数字居中显示，无盾时整条隐藏。盾值唯一来源=基地城墙建筑效果(升级提升耐久上限，每 5 级阶段奖励开局盾值)，伤害先扣盾再扣耐久。",
   "右侧为大招按钮纵列(4×1 右对齐，共 4 钮，各英雄独立充能环，充能满高亮呼吸、点击直接释放)。",
   "预警横幅与 BOSS 血条平时隐藏，事件触发时从顶部滑入。"],
  interact:["暂停→④；大招按钮→直接释放（极简演出）；伤害统计→③；三选一触发→②（全场冻结）。",
   "点击普攻/技能/未充满大招图标 → 图标侧边弹出属性Tips(⑧)，再点关闭，战斗不暂停。",
   "耐久<30%：耐久条红光呼吸 + 防线抖动；耐久归零 → ⑤ 失败结算弹窗内看广告复活。"],
  diff:["参考图右侧为『武器卡+技能槽列』；本项目改为英雄头顶普攻/技能双图标 + 右侧纵列大招按钮(4×1，随英雄解锁逐格点亮)。",
   "参考图波次 1/20 固定节奏；本项目清场驱动，进度条含义=波序。",
   "参考图单英雄+宠物；本项目 4 英雄站桩，无宠物。"]
 }};

/* ---- S2 三选一 ---- */
SCREENS.pick={name:"② 三选一强化弹窗",en:"Upgrade Pick",render:function(){
  var s='';
  s+=SCREENS.battle.render();
  s+='<div class="ovl"><div class="dim"></div>';
  s+=ph("ui_banner_title",115,308,520,88,{cls:"gold",txt:"选择强化"});

    {r:"#c9d6df",name:"磨利刀刃",desc:"学习 攻击力+20%",badge:"白·攻击"},

    s+=ph("ui_card_frame_"+["white","blue","purple"][i],x,428,200,360,{cls:"dark",txt:""});

    s+=ph("fx_card_icon_"+i,x+55,513,90,90,{cls:"circ",txt:"96×96"});
    s+=ph("ui_badge_hero",x+140,436,56,56,{cls:"circ gold",txt:"英雄"});
    s+=ph("ui_badge_new",x-16,412,56,56,{cls:"green circ",txt:"新"});
    s+=txt(x,698,200,60,c.desc,'','font-size:10px;color:#e9dcb5');
    s+=txt(x,728,200,30,c.badge,'','font-size:9px;opacity:.7');

  s+=ph("ui_btn_ad_refresh",130,862,300,76,{cls:"green",txt:"▶ 广告刷新"});
  s+=ph("ui_btn_diamond_refresh",460,862,180,76,{cls:"gold",txt:"💎2 钻石刷新"});
  s+=ph("ui_icon_eye",660,968,60,60,{cls:"dark circ",txt:"👁"});
  s+=txt(150,972,450,60,"（👁长按可透视战场）",'','font-size:10px;opacity:.6');
  s+='</div>';

 notes:{
  layout:["半透明黑罩(70%)压住战斗场景；撕纸质感金色标题横幅『选择强化』(520×88)。",
   "3 张卡 200×360，间距 16：顶部稀有度色条(白/蓝/紫)+卡名 → 齿轮环内 90×90 卡图标 → 右上英雄归属角标(56×56 圆形小头像) → 左上『新』角标(首次出现) → 底部描述两行。",
   "卡池混合抽卡：上阵英雄各自卡池按权重抽 3 张不重复，全局卡无归属角标。"],
  interact:["点击卡片→学习并恢复战斗；同名卡叠加，右上角不显示层数(叠层在描述文案中体现)。",
   "刷新：每弹窗内广告刷新×1 + 钻石刷新×1(2钻/次)，用完置灰；跨弹窗重置。",
   "连升多级：弹窗排队依次弹出。"],
  diff:["参考图只有广告刷新一个按钮；本项目增加钻石刷新双通道。",
   "参考图无归属概念；本项目每张卡标注归属英雄头像（按英雄单独强化）。"]
 }};

/* ---- S3 伤害统计 ---- */
SCREENS.stats={name:"③ 伤害统计 Tips",en:"Damage Stats",render:function(){
  var s='';
  s+=ph("bg_ch1_forest",0,0,750,1334,{cls:"dark",css:"background:rgba(46,64,52,.30);border-color:rgba(120,180,110,.4)",txt:"(战斗场景透底)"});

 notes:{
  layout:["统计按钮激活态(金色高亮描边)；面板 360×470 半透明，左上区域浮于战场之上，不暂停游戏。",

  var total=0;
  MANIFEST.forEach(function(g){
    h+='<div class="gh">'+g[0]+'</div><table><tr><th>资源ID</th><th>说明</th><th>尺寸(设计px)</th><th>数量</th><th>使用界面</th><th>备注</th></tr>';
    g[1].forEach(function(r){total+=parseInt(r[3])||1;
      h+='<tr><td><code>'+r[0]+'</code></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+(r[5]||"")+'</td></tr>';});
    h+='</table>';
  });
  h+='<p><b>规模合计</b>：清单条目约 '+MANIFEST.reduce(function(a,g){return a+g[1].length},0)+' 类，含帧数/变体总贴图量预估 <b>110~140 张</b>（程序化特效与 tint 复用可压至 ~100）。</p>';

}

  var n='<h2>'+sc.name+'</h2>';
  n+='<h3>布局说明</h3><ul>'+sc.notes.layout.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  n+='<h3>交互与状态</h3><ul>'+sc.notes.interact.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  n+='<h3>与参考图差异</h3><ul>'+sc.notes.diff.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  E("#notes",n);
  applyToggles();
}
function applyToggles(){
  var p=document.getElementById("phone");
  if(p){p.classList.toggle("noanno",!document.getElementById("tgAnno").checked);
    p.classList.toggle("safe",document.getElementById("tgSafe").checked);
    p.classList.toggle("grid",document.getElementById("tgGrid").checked);}
  document.body.classList.toggle("noanno",!document.getElementById("tgAnno").checked);
}
document.getElementById("tgAnno").onchange=applyToggles;
document.getElementById("tgSafe").onchange=applyToggles;
document.getElementById("tgGrid").onchange=applyToggles;
renderAll();
</script>
</body>
</html>
