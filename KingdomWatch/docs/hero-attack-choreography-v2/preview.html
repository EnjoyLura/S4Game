<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>英雄攻击动作 · 分阶段重做</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17272e;color:#eef1e6;font:16px system-ui,'Microsoft YaHei',sans-serif}main{max-width:960px;margin:auto;padding:24px 16px 40px}h1{font-size:25px}h2{font-size:20px;margin-top:28px}p{color:#b9c9c7;line-height:1.7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}canvas{display:block;width:100%;height:auto;border:1px solid #42544c;border-radius:10px;background:#293c3b}figure{margin:0}figcaption{text-align:center;margin:9px 0;color:#c9d5c8}.toolbar,.links{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}button,select{background:#bfd794;color:#253125;border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font:600 15px system-ui}a{color:#c5dfab}input{accent-color:#bfd794;max-width:100%}img,video{display:block;width:100%;object-fit:contain;border-radius:8px}.links{line-height:1.8}output{line-height:1.7}.status{border-left:3px solid #b7cc94;padding:10px 14px;background:#21353a}</style>
<main><h1>英雄攻击动作 · 分阶段重做</h1>
<p>重弩手：小幅瞄准 → 发射 → 手动上弩 → 回正继续瞄准。雷法师：前脚轻踏稳住重心 → 法杖小幅前伸施法 → 收杖回位。攻击结束后，范围内还有目标就继续备战，空闲才播放待机。</p><p class="status" id="status">正在加载本次制作状态…</p>
<div class="toolbar"><button id="play">暂停</button><button id="background">浅色背景</button><label>播放模式 <select id="mode"><option value="cycle">待机 → 攻击 → 待机</option><option value="combat">持续攻击</option><option value="attack">完整攻击循环</option><option value="idle">只看待机</option></select></label><label>速度 <select id="speed"><option value="1">正常</option><option value="0.5">0.5 倍</option><option value="0.25">0.25 倍</option></select></label><button id="restart">从头播放</button></div>
<div class="toolbar"><label>周期进度 <input id="progress" type="range" min="0" max="4000" value="0"></label><output id="phase"></output></div>
<h2>重弩手</h2><p id="sniperStatus"></p><div class="pair"><figure><canvas id="sniperLeft"></canvas><figcaption>原向</figcaption></figure><figure><canvas id="sniperRight"></canvas><figcaption>镜像</figcaption></figure></div>
<h2>雷法师</h2><p id="voltStatus"></p><div class="pair"><figure><canvas id="voltLeft"></canvas><figcaption>原向</figcaption></figure><figure><canvas id="voltRight"></canvas><figcaption>镜像</figcaption></figure></div>
<h2>游戏显示尺寸 · 弓箭手对照</h2><canvas id="battle"></canvas>
<div id="media"></div><div class="links"><a href="/">进入正式游戏</a><a href="sniper/attack-prompt.txt">重弩手提示词</a><a href="volt/attack-prompt.txt">雷法师提示词</a></div>
</main><script>
(async()=>{
const image=async src=>{const im=new Image();im.src=src;await im.decode();return im};
const load=async(dir,kind)=>{const m=await fetch(`${dir}/${kind}.frames.json`).then(r=>{if(!r.ok)throw Error('素材缺失');return r.json()});const ims=await Promise.all((m.textures??[`${kind}.png`]).map(file=>image(`${dir}/${file}`)));let end=0;return{m,ims,ends:m.animation.frames.map((_,i)=>end+=m.animation.frameDurations?.[i]??m.animation.seconds/m.animation.frames.length)}};
const production=await fetch('production.json').then(r=>r.json()),available=production.availableHeroes;
const[si,vi,archer,floor,wall]=await Promise.all([load('sniper','idle'),load('volt','idle'),load('archer','idle'),image('floor.png'),image('wall.png')]);
const heroes={sniper:{idle:si,attack:null},volt:{idle:vi,attack:null}},names={sniper:'重弩手',volt:'雷法师'};
for(const hero of available){heroes[hero].attack=await load(hero,'attack');const section=document.createElement('section');const title=document.createElement('h2');title.textContent=`${names[hero]} · 新攻击与待机切换 GIF`;section.append(title);const gif=document.createElement('img');gif.src=`${hero}/attack-mirror.gif`;gif.alt=title.textContent;section.append(gif);const vt=document.createElement('h2');vt.textContent=`${names[hero]} · 本次生成原视频`;section.append(vt);const video=document.createElement('video');video.src=`${hero}/source.mp4`;video.controls=true;video.muted=true;video.playsInline=true;video.preload='metadata';section.append(video);document.querySelector('#media').append(section)}
document.querySelector('#status').textContent=available.length===2?'两位英雄新攻击已接入，效果请人工查看。':'重弩手新攻击已接入。雷法师新视频因 AI 接口余额不足尚未生成，下方仅展示现有待机。';
for(const hero of ['sniper','volt'])document.querySelector(`#${hero}Status`).textContent=heroes[hero].attack?heroes[hero].attack.m.choreography.description:'本次新攻击待生成，现有待机保持。';
let playing=true,light=false,time=0,last=performance.now(),mode='cycle',speed=1;
const progress=document.querySelector('#progress'),cycle=Math.max(...available.map(hero=>heroes[hero].attack.m.animation.seconds))+2;progress.max=Math.round(cycle*1000);
function index(c,t){let i=0;while(i<c.ends.length-1&&t>=c.ends[i])i++;return i}
function frame(c,t){const i=index(c,t),name=c.m.animation.frames[i];return{rect:c.m.frames[name],im:c.ims[c.m.framePages?.[name]??0]}}
function context(id,w,h){const el=document.getElementById(id),d=Math.min(devicePixelRatio||1,3);if(el.width!==w*d||el.height!==h*d){el.width=w*d;el.height=h*d}const c=el.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);return c}
function paint(c,clip,t,x,y,height,dir=1){const{rect,im}=frame(clip,t),m=clip.m,s=height/m.readyHeightPx;c.save();c.translate(x,y);c.scale(dir,1);c.drawImage(im,...rect,-m.groundAnchor[0]*s,-m.groundAnchor[1]*s,rect[2]*s,rect[3]*s);c.restore()}
function action(a,t){const i=index(a,t);return a.m.animation.phases?.find(p=>i>=p.startIndex&&i<p.endIndexExclusive)?.name??'攻击'}
function choose(h){const a=h.attack,p=time%cycle;if(!a||mode==='idle')return{clip:h.idle,t:time%h.idle.m.animation.seconds,label:a?'待机':'新攻击待生成'};const seconds=a.m.animation.seconds;if(mode==='attack'){const t=time%seconds;return{clip:a,t,label:action(a,t)}}if(mode==='combat'){const q=time%(seconds+.25);return{clip:a,t:Math.min(q,seconds),label:q<seconds?action(a,q):'继续瞄准／备战'}}if(p<1)return{clip:h.idle,t:p,label:'待机'};if(p<1+seconds)return{clip:a,t:p-1,label:action(a,p-1)};return{clip:h.idle,t:(p-1-seconds)%h.idle.m.animation.seconds,label:'回到待机'}}
function panel(id,view,dir){const c=context(id,420,510);c.fillStyle=light?'#e8dfc5':'#293c3b';c.fillRect(0,0,420,510);c.strokeStyle=light?'#b8ac90':'#4a6158';c.beginPath();c.moveTo(15,486);c.lineTo(405,486);c.stroke();paint(c,view.clip,view.t,210,486,380,dir)}
function draw(){const s=choose(heroes.sniper),v=choose(heroes.volt);panel('sniperLeft',s,1);panel('sniperRight',s,-1);panel('voltLeft',v,1);panel('voltRight',v,-1);const c=context('battle',750,500);c.drawImage(floor,0,0,750,500);c.drawImage(wall,0,210,750,321);paint(c,archer,time%archer.m.animation.seconds,140,440,archer.m.displayHeight);paint(c,s.clip,s.t,370,440,si.m.displayHeight);paint(c,v.clip,v.t,600,440,vi.m.displayHeight);progress.value=Math.round(time%cycle*1000);document.querySelector('#phase').textContent=`弩：${s.label} · 雷：${v.label}`}
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放'};document.querySelector('#background').onclick=e=>{light=!light;e.target.textContent=light?'深色背景':'浅色背景';draw()};document.querySelector('#mode').onchange=e=>{mode=e.target.value;time=0;draw()};document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value)};document.querySelector('#restart').onclick=()=>{time=0;playing=true;document.querySelector('#play').textContent='暂停';draw()};progress.oninput=e=>{playing=false;document.querySelector('#play').textContent='播放';time=Number(e.target.value)/1000;draw()};function tick(now){const dt=Math.min((now-last)/1000,.1);last=now;if(playing){time+=dt*speed;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
})().catch(()=>document.querySelector('h1').textContent='素材加载失败，请刷新重试');
</script></html>
