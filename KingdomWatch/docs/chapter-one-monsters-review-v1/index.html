<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第一章 · 怪物设计审阅</title>
<style>
:root{color-scheme:light;--ink:#23333d;--paper:#fbf4df;--gold:#b29155;--muted:#73766d}
*{box-sizing:border-box}body{margin:0;background:#e9e3d4;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
header{max-width:1180px;margin:0 auto;padding:36px 24px 22px}h1{font-size:clamp(25px,4vw,38px);margin:0 0 10px}p{line-height:1.65;margin:8px 0}
.status{display:flex;gap:9px;flex-wrap:wrap;font-size:13px}.status span{padding:6px 11px;border:1px solid #cabc9e;border-radius:20px;background:var(--paper)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}button,a.action{font:inherit;cursor:pointer;border:1px solid #ac9872;border-radius:8px;background:var(--paper);color:var(--ink);padding:9px 14px;text-decoration:none}
button:hover,a.action:hover{background:#f5e3b4}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #397fa1;outline-offset:3px}
button[aria-pressed=true]{background:#233e50;color:#fff;border-color:#233e50}.subtle{font-size:13px;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:0 24px 32px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--paper);border:1px solid #c9b88e;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px #42361e0a}
.art{padding:0;border:0;border-radius:0;width:100%;display:block;background:#fffbee;position:relative}
.art img{width:100%;aspect-ratio:1;display:block;object-fit:contain}.number{position:absolute;left:12px;top:12px;border-radius:6px;background:#223c50;color:white;padding:4px 7px;font-size:12px}
.card-info{padding:14px 16px 16px;border-top:1px solid #dfd3b7}.card h2{font-size:20px;margin:0 0 7px}.role{font-size:12px;color:#7d5820;border:1px solid #d8bf8d;border-radius:4px;padding:2px 6px}.card-info p{font-size:13px;color:#727269;margin:8px 0}
.card-links{display:flex;gap:14px;font-size:13px}.card-links a{color:#2c657d}footer{font-size:13px;color:#6e7068;margin-top:24px}
dialog{border:1px solid #bfa97b;border-radius:12px;padding:0;width:min(1040px,96vw);max-height:96vh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#07131ad9}.viewer-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #d8c9a8}.viewer-head strong{flex:1;font-size:20px}.viewer-head span{font-size:13px;color:var(--muted)}.close{font-size:20px;padding:3px 12px}
.viewer-body{display:grid;grid-template-columns:minmax(0,1fr) 250px}.viewer-body img{width:100%;height:min(72vh,760px);object-fit:contain;background:#fffbee}
aside{padding:18px;display:flex;flex-direction:column;gap:12px;border-left:1px solid #d8c9a8}.viewer-nav{display:flex;gap:8px}.viewer-nav button{flex:1;padding:8px}.viewer-note{line-height:1.5;font-size:14px}
textarea{resize:vertical;width:100%;min-height:150px;padding:10px;border:1px solid #b9ad91;border-radius:6px;background:#fffdf7;font:inherit;color:var(--ink)}
.hidden{display:none!important}
@media(max-width:760px){header{padding:24px 16px 18px}main{padding:0 16px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-info{padding:12px}.card h2{font-size:17px}.viewer-body{grid-template-columns:1fr}.viewer-body img{height:52vh}aside{border-left:0;border-top:1px solid #d8c9a8;padding:12px}.viewer-head strong{font-size:17px}textarea{min-height:85px}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.art img{max-height:360px}.status{font-size:12px}}
</style>
</head>
<body>
<header>
<h1>第一章 · 怪物设计审阅</h1>
<div class="status"><span>8 种常规怪物 + 1 个 Boss</span><span>本轮新增 5 张</span><span>全部待审阅</span></div>
<p>点击图卡放大，使用 <b>← →</b> 逐张检查，<b>Esc</b> 关闭。每张都能打开原图或记录修改意见。</p>
<div class="toolbar"><button type="button" data-filter="all" aria-pressed="true">全部 9 张</button><button type="button" data-filter="new" aria-pressed="false">本轮新增 5 张</button><button type="button" id="start-review">从第一张开始</button><button type="button" id="export-notes">导出审阅备注</button><a class="action" href="README.md">清单与提示词</a></div>
<p class="subtle">已有四张作为当前候选纳入总览；继续制作不代表造型已定稿。图卡等比展示，不代表游戏内体型比例。</p>
</header>
<main><div class="grid" id="grid"></div><footer>单张均为内置生图原 PNG 的完整复制，浅色纯背景，等待美术审阅。此页不启动游戏；本轮未替换游戏资源或制作序列帧。</footer></main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-head"><strong id="viewer-title"></strong><span id="viewer-position"></span><button type="button" class="close" id="close-viewer" aria-label="关闭">×</button></div><div class="viewer-body"><img id="viewer-image" alt=""><aside><div class="viewer-nav"><button type="button" id="previous">← 上一张</button><button type="button" id="next">下一张 →</button></div><div class="viewer-note" id="viewer-note"></div><a id="original" class="action" target="_blank" rel="noopener">打开 PNG 原图 ↗</a><a id="download-image" class="action" download>保存当前图片</a><label for="review-note">这只的修改意见</label><textarea id="review-note" placeholder="例如：头饰缩小；衣摆太整齐；四足再露一点背……"></textarea><small class="subtle" id="note-status">备注保存在当前浏览器，可导出全部备注。</small></aside></div></dialog>
<script>
const creatures=[{"id":"01-grunt","name":"兽族散兵","role":"基础近战","group":"earlier","note":"骨盔、破损红布、低位短刃","image":"assets/01-grunt.png"},{"id":"02-stone-thrower","name":"兽族投手","role":"远程投石","group":"earlier","note":"短兽吻、紧凑体态、腿侧握石","image":"assets/02-stone-thrower.png"},{"id":"03-bone-warg","name":"噬骨座狼","role":"快速近战","group":"earlier","note":"正面微俯视、露出一点背部","image":"assets/03-bone-warg.png"},{"id":"04-redwing-vulture","name":"赤翼秃鹫","role":"飞行","group":"earlier","note":"秃头钩喙、赤翼、完整展翼留白","image":"assets/04-redwing-vulture.png"},{"id":"05-shieldbearer","name":"兽人盾兵","role":"防御","group":"new","note":"矮宽体型、拼木盾、锈铁小盔","image":"assets/05-shieldbearer.png"},{"id":"06-bone-healer","name":"骨杖巫医","role":"治疗支援","group":"new","note":"瘦长体态、偏肩旧披料、骨杖药囊","image":"assets/06-bone-healer.png"},{"id":"07-red-banner-wolfrider","name":"赤旗狼骑","role":"骑乘冲锋","group":"new","note":"小骑手与座狼、侧后破旗、微俯视","image":"assets/07-red-banner-wolfrider.png"},{"id":"08-splinterwood-troll","name":"碎木巨魔","role":"重型精英","group":"new","note":"长臂短腿、苔灰绿皮、断木桩","image":"assets/08-splinterwood-troll.png"},{"id":"09-gatebreaker-boss","name":"双头食人魔「断门者」","role":"关底 Boss","group":"new","note":"两颗不同头型、厚重体态、破门梁","image":"assets/09-gatebreaker-boss.png"}];
const promptFiles={"01-grunt":"01-grunt.txt","02-stone-thrower":"02-stone-thrower-front-fix.txt","03-bone-warg":"03-bone-warg-gentler-camera.txt","04-redwing-vulture":"04-vulture-padding.txt","05-shieldbearer":"05-shieldbearer.txt","06-bone-healer":"06-bone-healer-front-fix.txt","07-red-banner-wolfrider":"07-red-banner-wolfrider-padding.txt","08-splinterwood-troll":"08-splinterwood-troll-species-fix.txt","09-gatebreaker-boss":"09-gatebreaker-boss-padding.txt"};
const grid=document.getElementById('grid'), viewer=document.getElementById('viewer'), note=document.getElementById('review-note');
let current=0, filter='all', notes={};
try{notes=JSON.parse(localStorage.getItem('kw-ch1-monster-review-v1')||'{}')||{}}catch(error){notes={}}
function openCreature(index){current=(index+creatures.length)%creatures.length;const item=creatures[current];document.getElementById('viewer-title').textContent=item.name;document.getElementById('viewer-position').textContent=(current+1)+' / '+creatures.length;const picture=document.getElementById('viewer-image');picture.src=item.image;picture.alt=item.name;document.getElementById('viewer-note').textContent=item.role+' · '+item.note;document.getElementById('original').href=item.image;document.getElementById('download-image').href=item.image;document.getElementById('download-image').download=item.id+'.png';note.value=notes[item.id]||'';if(!viewer.open)viewer.showModal()}
function render(){grid.replaceChildren();creatures.forEach((item,index)=>{if(filter==='new'&&item.group!=='new')return;const card=document.createElement('article');card.className='card';card.innerHTML='<button type="button" class="art"><span class="number">'+String(index+1).padStart(2,'0')+'</span><img src="'+item.image+'" alt="'+item.name+'" loading="lazy"></button><div class="card-info"><h2>'+item.name+'</h2><span class="role">'+item.role+'</span><p>'+item.note+'</p><div class="card-links"><a href="'+item.image+'" target="_blank" rel="noopener">原图</a><a href="prompts/'+promptFiles[item.id]+'" target="_blank" rel="noopener">当前提示词</a></div></div>';card.querySelector('button').addEventListener('click',()=>openCreature(index));grid.append(card)})}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(control=>control.setAttribute('aria-pressed',String(control===button)));render()}));
document.getElementById('start-review').addEventListener('click',()=>openCreature(filter==='new'?4:0));
document.getElementById('close-viewer').addEventListener('click',()=>viewer.close());
document.getElementById('previous').addEventListener('click',()=>openCreature(current-1));
document.getElementById('next').addEventListener('click',()=>openCreature(current+1));
document.addEventListener('keydown',event=>{if(!viewer.open||event.target===note)return;if(event.key==='ArrowLeft'){event.preventDefault();openCreature(current-1)}if(event.key==='ArrowRight'){event.preventDefault();openCreature(current+1)}});
note.addEventListener('input',()=>{notes[creatures[current].id]=note.value;try{localStorage.setItem('kw-ch1-monster-review-v1',JSON.stringify(notes));document.getElementById('note-status').textContent='已保存到当前浏览器。'}catch(error){document.getElementById('note-status').textContent='浏览器未能保存，请及时导出全部备注。'}});
document.getElementById('export-notes').addEventListener('click',()=>{const body='第一章怪物设计审阅备注\n\n'+creatures.map((item,index)=>(index+1)+'. '+item.name+'\n'+(notes[item.id]||'（未填写）')).join('\n\n');const url=URL.createObjectURL(new Blob(['\ufeff',body],{type:'text/plain;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='第一章怪物-审阅备注.txt';document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)});
render();
</script>
</body></html>
