<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>重弩手 · 攻击动作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17272e;color:#f1f2e7;font:16px system-ui,"Microsoft YaHei",sans-serif}main{max-width:950px;margin:auto;padding:24px 16px 36px}h1{font-size:25px;margin:0 0 12px}h2{font-size:20px;margin:28px 0 12px}p{line-height:1.7;color:#bbcac8}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}canvas{display:block;width:100%;height:auto;border:1px solid #42544c;border-radius:10px}figcaption{text-align:center;color:#c9d5c8;margin:9px 0 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}button,select{border:0;border-radius:7px;padding:10px 13px;background:#bfd794;color:#253125;font:600 15px system-ui;cursor:pointer}a{color:#c5dfab}input{accent-color:#bfd794;max-width:100%}.links{display:flex;flex-wrap:wrap;gap:16px;line-height:1.9}video{display:block;width:100%;max-height:560px;background:red;border-radius:10px}
</style>
<main><h1>重弩手 · 攻击动作</h1><p>完整动作与待机共用人物大小和脚底，左右镜像。可逐帧查看，也可从实战发射时刻回放。</p>
<div class="pair"><figure><canvas id="left"></canvas><figcaption>原向</figcaption></figure><figure><canvas id="right"></canvas><figcaption>镜像</figcaption></figure></div>
<div class="toolbar"><button id="full">完整动作</button><button id="fire">实战发射</button><button id="idle">待机</button><button id="play">暂停</button><button id="bg">浅色背景</button><label>速度 <select id="speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label><label>攻击帧 <input id="frame" type="range" min="0" value="0"></label><span id="counter"></span></div>
<h2>游戏素材合成 · 实际显示尺寸</h2><canvas id="battle"></canvas>
<h2>AI 源视频</h2><video src="source.mp4" controls loop muted playsinline preload="metadata"></video><p id="sourceInfo"></p>
<div class="links"><a href="attack.png" download>攻击图集</a><a href="attack.frames.json" download>帧与时序</a><a href="contact-sheet.jpg">全部帧接触表</a><a href="attack-mirror.gif">镜像 GIF</a><a href="battle-composite.gif">场景 GIF</a><a href="source.mp4">源视频</a><a href="attack-prompt.txt">提示词</a></div>
</main><script>
(async()=>{
const loadImage=async src=>{const im=new Image();im.src=src;await im.decode();return im};
const [m,idle,a,attackImage,idleImage,archer,floor,wall]=await Promise.all([
 fetch('attack.frames.json').then(r=>r.json()),fetch('idle.frames.json').then(r=>r.json()),fetch('archer-idle.frames.json').then(r=>r.json()),
 loadImage('attack.png'),loadImage('idle.png'),loadImage('archer-idle.png'),loadImage('floor.png'),loadImage('wall.png')]);
document.querySelector('#sourceInfo').textContent='两秒视频请求，实际源视频 '+m.source.seconds.toFixed(2)+' 秒；本次攻击采用 '+m.animation.frames.length+' 个完整人物帧。';
const edges=meta=>{const list=[0];for(const dt of meta.animation.frameDurations||Array(meta.animation.frames.length).fill(meta.animation.seconds/meta.animation.frames.length))list.push(list.at(-1)+dt);return list};
const attackEdges=edges(m),idleEdges=edges(idle),release=m.animation.releaseIndex;
const atTime=(list,time)=>{let i=0;while(i<list.length-2&&time>=list[i+1])i++;return i};
let light=false,playing=true,clock=0,mode='full',speed=1,index=0,last=performance.now();
const slider=document.querySelector('#frame');slider.max=m.animation.frames.length-1;
function context(id,w,h){const canvas=document.querySelector('#'+id),dpr=Math.min(devicePixelRatio||1,3);if(canvas.width!==w*dpr||canvas.height!==h*dpr){canvas.width=w*dpr;canvas.height=h*dpr}const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);return c}
function paint(c,image,rect,meta,x,y,height,dir=1){const s=height/meta.readyHeightPx;c.save();c.translate(x,y);c.scale(dir,1);c.drawImage(image,...rect,-meta.groundAnchor[0]*s,-meta.groundAnchor[1]*s,rect[2]*s,rect[3]*s);c.restore()}
function selected(){if(mode==='frame')return {meta:m,image:attackImage,index};if(mode==='idle')return {meta:idle,image:idleImage,index:atTime(idleEdges,clock%idle.animation.seconds)};const start=mode==='fire'?attackEdges[release]:0,duration=m.animation.seconds-start,phase=clock%(duration+.65);if(phase>=duration)return {meta:idle,image:idleImage,index:0};index=atTime(attackEdges,start+phase);return {meta:m,image:attackImage,index}}
function draw(){const s=selected(),rect=s.meta.frames[s.meta.animation.frames[s.index]];for(const [id,dir] of [['left',1],['right',-1]]){const c=context(id,420,510);c.fillStyle=light?'#e8dfc5':'#293c3b';c.fillRect(0,0,420,510);paint(c,s.image,rect,s.meta,210,486,380,dir)}const c=context('battle',750,500);c.drawImage(floor,0,0,750,500);c.drawImage(wall,0,210,750,321);const ai=Math.floor(clock%a.animation.seconds/a.animation.seconds*a.animation.frames.length);paint(c,archer,a.frames[a.animation.frames[ai]],a,210,440,a.displayHeight);paint(c,s.image,rect,s.meta,540,440,s.meta.displayHeight);if(s.meta===m){slider.value=s.index;document.querySelector('#counter').textContent=(s.index+1)+' / '+m.animation.frames.length+(s.index===release?' · 发射':'')}else document.querySelector('#counter').textContent='待机'}
function choose(next){mode=next;clock=0;playing=true;document.querySelector('#play').textContent='暂停';draw()}
document.querySelector('#full').onclick=()=>choose('full');document.querySelector('#fire').onclick=()=>choose('fire');document.querySelector('#idle').onclick=()=>choose('idle');
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放'};document.querySelector('#bg').onclick=e=>{light=!light;e.target.textContent=light?'深色背景':'浅色背景';draw()};document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);
slider.oninput=e=>{mode='frame';playing=false;index=Number(e.target.value);document.querySelector('#play').textContent='播放';draw()};
function tick(now){const dt=Math.min((now-last)/1000,.1);last=now;if(playing){if(mode==='frame'){mode='full';clock=attackEdges[index]}clock+=dt*speed;draw()}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
})().catch(()=>{document.querySelector('h1').textContent='素材加载失败，请刷新重试'});
</script></html>
