<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>弓箭手 · 动作预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#172826;color:#f8efd7}*{box-sizing:border-box}body{margin:0;padding:24px 16px 36px}main{max-width:980px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#b7c5b7;font-size:14px;line-height:1.7;margin:0 0 20px}.stage{border:1px solid #526b58;border-radius:16px;overflow:hidden;background:#263d35;position:relative}canvas{display:block;width:100%;touch-action:none}.tag{position:absolute;top:16px;left:18px;color:#d7d9bd;font-size:13px;pointer-events:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}button,select{font:inherit;border:1px solid #597363;border-radius:9px;background:#30483b;color:#f8efd7;padding:10px 16px;cursor:pointer}button.active{background:#b9964c;color:#13241c;border-color:#d0b26d}label{color:#b7c5b7;margin-left:6px;font-size:14px}input{accent-color:#dbbc72}.status{margin-top:16px;display:flex;justify-content:space-between;color:#bac6b2;font-size:13px}#timeline{width:100%;margin-top:18px}small{color:#a4b79f;display:block;margin-top:12px;line-height:1.6}.smalltag{position:absolute;right:18px;bottom:18px;color:#c4ccb8;font-size:12px}@media(max-width:600px){body{padding-top:18px}h1{font-size:21px}button,select{padding:10px 12px}.smalltag{bottom:10px;font-size:10px}}
</style>
<main><h1>弓箭手 · 动作预览</h1><p>短棕发精灵弓手，在防线上呼吸、拉弓、放箭。点选方向，或拖动上方的目标观察转身。</p>
<div class="stage"><canvas id="scene" width="960" height="680"></canvas><span class="tag" id="state">待机</span><span class="smalltag">右下：战斗原尺寸</span></div>
<div class="controls"><button data-mode="idle">待机</button><button data-mode="attack" class="active">射箭</button><button data-mode="rapid">连射</button><button data-mode="heavy">强化箭</button><button id="pause">暂停</button><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label></div>
<div class="controls"><button data-angle="-0.82">左前方</button><button data-angle="0" class="active">正前方</button><button data-angle="0.82">右前方</button></div>
<input type="range" id="timeline" min="0" max="1" step="0.001" value="0"><div class="status"><span id="phase">正在拉弓</span><span id="time">0.00 s</span></div><small>拖动时间条可逐帧查看。动作保持脚底位置固定，弓由左手持握，右手拉弦。</small></main>
<script type="module">
import {ArcherRigPose} from './archer-rig.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),frames=(await (await fetch('./parts.frames.json')).json()).frames,atlas=new Image();atlas.src='./parts.png';await atlas.decode();
let model=new ArcherRigPose(frames),mode='attack',angle=0,paused=false,speed=1,t=0,last=performance.now(),flight=[],previous=0;
const period=1.55,releaseAt=.38;
const target=()=>({x:Math.sin(angle),y:Math.cos(angle)});
function prepare(time){if(mode==='idle')return 0;const local=time%period;if(mode==='rapid'&&local>=.38&&local<.66)return 1;return local<releaseAt?Math.min(1,local/releaseAt):0;}
function step(dt){const old=t;t+=dt;const dir=target(),local=t%period,cycle=Math.floor(t/period);if(mode!=='idle')for(const rt of mode==='rapid'?[.38,.50,.62]:[.38]){if(Math.floor((old-rt)/period)<Math.floor((t-rt)/period)){const p=model.release(dir.x,dir.y,mode==='heavy');flight.push({x:0,y:136,dx:dir.x,dy:dir.y,age:0,heavy:mode==='heavy'});}}const p=model.tick(dt,prepare(t),dir.x,dir.y);for(const a of flight){a.age+=dt;a.x+=a.dx*270*dt;a.y+=a.dy*270*dt;}flight=flight.filter(a=>a.age<1.5);render(p);}
function drawRig(p,x,y,k){ctx.save();ctx.translate(x,y);ctx.scale(k,-k);ctx.fillStyle='#0b17184d';ctx.beginPath();ctx.ellipse(0,2,27,6,0,0,Math.PI*2);ctx.fill();for(const s of p.parts){const [sx,sy,sw,sh]=frames[s.name];ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle*Math.PI/180);ctx.scale(1,-1);ctx.drawImage(atlas,sx,sy,sw,sh,-s.ax*s.width,-(1-s.ay)*s.height,s.width,s.height);ctx.restore();}ctx.strokeStyle='#dabd87';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(p.bowTop.x,p.bowTop.y);ctx.lineTo(p.stringPoint.x,p.stringPoint.y);ctx.lineTo(p.bowBottom.x,p.bowBottom.y);ctx.stroke();if(p.arrowVisible)drawArrow(p.arrowTail,p.arrowTip,false);for(const a of flight)drawArrow({x:a.x-a.dx*23,y:a.y-a.dy*23},{x:a.x,y:a.y},a.heavy);ctx.restore();}
function drawArrow(p,tip,heavy){let dx=tip.x-p.x,dy=tip.y-p.y,l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;ctx.strokeStyle=heavy?'#efce77':'#8d5b31';ctx.lineWidth=heavy?1.3:.9;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(tip.x,tip.y);ctx.stroke();ctx.fillStyle=heavy?'#ffe3a0':'#dce1d8';ctx.beginPath();ctx.moveTo(tip.x,tip.y);ctx.lineTo(tip.x-dx*4-dy*1.5,tip.y-dy*4+dx*1.5);ctx.lineTo(tip.x-dx*4+dy*1.5,tip.y-dy*4-dx*1.5);ctx.fill();ctx.strokeStyle='#f2ead3';ctx.lineWidth=1.2;for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(p.x+dx*5,p.y+dy*5);ctx.lineTo(p.x+dx-dy*side*2,p.y+dy+dx*side*2);ctx.stroke();}}
function render(p){ctx.clearRect(0,0,960,680);const grad=ctx.createLinearGradient(0,0,0,680);grad.addColorStop(0,'#345747');grad.addColorStop(.65,'#263e36');grad.addColorStop(1,'#1c302d');ctx.fillStyle=grad;ctx.fillRect(0,0,960,680);ctx.strokeStyle='#536c5740';ctx.lineWidth=1;for(let i=0;i<960;i+=80){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,510);ctx.stroke();}for(let j=0;j<500;j+=80){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(960,j);ctx.stroke();}ctx.fillStyle='#998966';ctx.fillRect(0,550,960,40);ctx.fillStyle='#bbaa7c';ctx.fillRect(0,550,960,8);ctx.strokeStyle='#685f48';for(let i=0;i<960;i+=120){ctx.beginPath();ctx.moveTo(i,558);ctx.lineTo(i,590);ctx.stroke();}drawRig(p,440,554,3.08);ctx.fillStyle='#1c302db3';ctx.fillRect(732,470,210,180);drawRig(p,836,636,1);const dir=target(),tx=440+dir.x*170,ty=125+(1-dir.y)*30;ctx.strokeStyle='#e1c677';ctx.lineWidth=2;ctx.beginPath();ctx.arc(tx,ty,12,0,Math.PI*2);ctx.moveTo(tx-18,ty);ctx.lineTo(tx+18,ty);ctx.moveTo(tx,ty-18);ctx.lineTo(tx,ty+18);ctx.stroke();let text=mode==='idle'?'待机 · 呼吸':p.age<.14?'放箭':p.age<.42?'回位':p.pull>.6?'拉弓':'持弓准备';document.querySelector('#state').textContent=text;document.querySelector('#phase').textContent=(p.facing==='up'?'正前方':p.facing==='left'?'左前方':'右前方')+' · '+text;document.querySelector('#time').textContent=(t%period).toFixed(2)+' s';document.querySelector('#timeline').value=(t%period)/period;}
function seek(value){t=0;flight=[];model=new ArcherRigPose(frames);const dir=target();for(let i=0;i<90;i++)model.tick(1/60,0,dir.x,dir.y);const duration=value*period;while(t<duration-1e-6)step(Math.min(1/120,duration-t));render(model.sample());}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));seek(0);});document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=+b.dataset.angle;document.querySelectorAll('[data-angle]').forEach(x=>x.classList.toggle('active',x===b));});document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'播放':'暂停';};document.querySelector('#speed').onchange=e=>speed=+e.target.value;document.querySelector('#timeline').oninput=e=>{paused=true;document.querySelector('#pause').textContent='播放';seek(+e.target.value);};
let dragging=false;function aim(e){const r=canvas.getBoundingClientRect();angle=Math.max(-1.08,Math.min(1.08,Math.atan2((e.clientX-r.left)*960/r.width-440,554-(e.clientY-r.top)*680/r.height)));document.querySelectorAll('[data-angle]').forEach(b=>b.classList.remove('active'));}canvas.onpointerdown=e=>{dragging=true;canvas.setPointerCapture(e.pointerId);aim(e);};canvas.onpointermove=e=>{if(dragging)aim(e);};canvas.onpointerup=()=>dragging=false;
window.__archerPreview={seek,render,step,setAngle:a=>{angle=a;},setMode:m=>{mode=m;},get model(){return model;},get pose(){return model.sample();},set paused(v){paused=v;},get time(){return t;}};
function loop(now){const dt=Math.min(.035,(now-last)/1000)*speed;last=now;if(!paused)step(dt);requestAnimationFrame(loop);}seek(0);requestAnimationFrame(loop);
</script></html>
