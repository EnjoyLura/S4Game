<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>王国守望</title>
<style>html,body{margin:0;height:100%;background:#101418;color:#fff5d8;font:17px system-ui,sans-serif}[hidden]{display:none!important}main{max-width:34em;margin:auto;padding:18vh 24px 30px}h1{font-size:26px}p{line-height:1.7;overflow-wrap:anywhere}button{padding:12px 22px;font-size:17px;background:#ffd05c;color:#20333f;border:0;border-radius:8px}</style>
</head><body><main id="kwProblem" hidden><h1>游戏暂时无法打开</h1><p id="kwLoad"></p><button id="kwRetry" hidden>重试</button></main>
<script>
(function(){
  'use strict';
  /*__WEBP_SUPPORT__*/
  var base = new URL('__BASE_PATH__',location.origin);
  var status = document.getElementById('kwLoad'), retry = document.getElementById('kwRetry'), problem = document.getElementById('kwProblem');
  var starting=false, canResume=false;
  function scoped(path){
    var u=new URL(path,base);
    if(u.origin!==base.origin || !u.pathname.startsWith(base.pathname) || /[?#]/.test(path)) throw new Error('发布路径不合法');
    return u;
  }
  function retryDelay(ms){return new Promise(function(resolve){
    function resume(){clearTimeout(timer);window.removeEventListener('online',resume);resolve();}
    var timer=setTimeout(resume,ms);window.addEventListener('online',resume,{once:true});
  });}
  async function network(url){
    for(var attempt=0;attempt<3;attempt++){
      var ctl=new AbortController(), timer=setTimeout(function(){ctl.abort();},20000);
      try {
        var r=await fetch(url,{cache:'no-store',signal:ctl.signal,credentials:'same-origin'});
        if(!r.ok){var http=new Error('HTTP '+r.status);http.permanent=r.status<500&&r.status!==408&&r.status!==429;throw http;}
        return await r.arrayBuffer();
      } catch(e){
        e.networkFailure=true;
        if(e.permanent||attempt===2)throw e;
      } finally{clearTimeout(timer);}
      await retryDelay(1000*(attempt+1));
    }
  }
  async function hash(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  async function start(){
    if(starting)return;
    starting=true;canResume=false;
    retry.hidden=true;problem.hidden=true;
    try {
      if(!window.isSecureContext || !crypto.subtle)throw new Error('请使用 HTTPS 和支持安全校验的现代浏览器');
      var manifestUrl=scoped('hosting-release.json');manifestUrl.searchParams.set('check',Date.now());
      var m=JSON.parse(new TextDecoder().decode(await network(manifestUrl)));
      if(m.schema!==1 || m.base_path!==base.pathname || !/^[a-f0-9]{64}$/.test(m.entry_sha256) || !/^game\.[a-f0-9]{16}\.html$/.test(m.entry))throw new Error('版本清单不完整');
      if(m.requires_cross_origin_isolation && !crossOriginIsolated)throw new Error('此版本需要跨源隔离，当前托管环境尚未满足');
      if(m.requires_webp && !await supportsLosslessWebP())throw new Error('当前浏览器不支持无损 WebP 图片，请升级浏览器或在系统浏览器打开');
      var bytes=await network(scoped(m.entry));
      if(await hash(bytes)!==m.entry_sha256)throw new Error('入口校验失败，请稍后重试');
      // The address remains the fixed project URL. The verified original Cocos
      // document supplies its explicit project base before any engine script.
      window.removeEventListener('online',resumeStart);
      document.open();document.write(new TextDecoder().decode(bytes));document.close();
    } catch(e){
      canResume=!!e.networkFailure&&!e.permanent;
      status.textContent=e.networkFailure
        ? (navigator.onLine===false?'网络已断开，连接恢复后会重试。':e.permanent?'游戏文件暂时无法下载（'+e.message+'），请稍后重试。':'连接中断或超时，请检查网络或VPN后重试。')
        : '游戏尚未加载：'+e.message;
      retry.hidden=false;problem.hidden=false;
    } finally{starting=false;}
  }
  function resumeStart(){if(canResume&&!problem.hidden)start();}
  window.addEventListener('online',resumeStart);
  retry.onclick=start;start();
})();
</script></body></html>
