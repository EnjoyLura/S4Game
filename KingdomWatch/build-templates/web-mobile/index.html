  <!-- 清晰度修复（须在引擎脚本之前执行）：
       引擎 pal/screen-adapter 将 dpr 钳制为 min(dpr,2)，3x 屏 canvas 只有 2/3 物理像素再被 CSS 拉伸 → HUD 发糊。
       这里把上限暴露为 window.__KW_DPR_CAP（默认 min(真实dpr,3)，即 3x 屏按原生 3x 渲染）；
       引擎包内的钳制补丁由 tools/patch-web-dpr.py 应用。URL 加 ?dpr=2 可回退（低端机省电调试）。 -->
  <script>
    (function () {
      try {
        var real = window.devicePixelRatio || 1;
        var q = parseFloat(new URLSearchParams(window.location.search).get('dpr'));
        window.__KW_DPR_CAP = q > 0 ? q : Math.min(real, 3);
      } catch (e) { window.__KW_DPR_CAP = 2; }
    })();
  </script>

  <!-- 运行时错误浮层：手机端脚本异常直接显示在画面顶部（否则用户只见空画面无从反馈）。
       正常运行不出现任何内容；最多显示 3 条，每条截断 240 字符。 -->
  <script>
    (function () {
      var seen = 0;
      function show(msg) {
        try {
          if (seen >= 3) return;
          var box = document.getElementById('kwErrBox');
          if (!box) {
            box = document.createElement('div');
            box.id = 'kwErrBox';
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;pointer-events:none;'
              + 'font:12px/1.4 monospace;color:#ff9a9a;background:rgba(0,0,0,.72);padding:4px 6px;'
              + 'white-space:pre-wrap;word-break:break-all;max-height:40%;overflow:hidden;text-align:left;';
            (document.body || document.documentElement).appendChild(box);
          }
          seen++;
          box.textContent += (box.textContent ? '\n' : '') + '⚠ ' + String(msg).slice(0, 240);
        } catch (e) { /* ignore */ }
      }
      window.addEventListener('error', function (e) {
        show((e && (e.message || (e.error && e.error.message))) || 'unknown error');
      });
      window.addEventListener('unhandledrejection', function (e) { show('REJ: ' + (e && e.reason)); });
      var ce = console.error;
      console.error = function () {
        try { show([].join.call(arguments, ' ')); } catch (x) { /* ignore */ }
        ce.apply(console, arguments);
      };
    })();
  </script>
