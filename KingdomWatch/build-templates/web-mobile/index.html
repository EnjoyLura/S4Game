  <!-- 清晰度修复（须在引擎脚本之前执行）：
       引擎 pal/screen-adapter 将 dpr 钳制为 min(dpr,2)，3x 屏 canvas 只有 2/3 物理像素再被 CSS 拉伸 → HUD 发糊。
       这里把上限暴露为 window.__KW_DPR_CAP（默认 min(真实dpr,3)，即 3x 屏按原生 3x 渲染）；
       引擎包内的钳制补丁由 tools/patch-web-dpr.py 应用。URL 加 ?dpr=2 可回退（低端机省电调试）。 -->
  <script>
    (function () {
      try {
        var real = window.devicePixelRatio || 1;
        var q = parseFloat(new URLSearchParams(window.location.search).get('dpr'));
        // 3x 屏按原生 3x 渲染修糊；URL ?dpr= 可强制（低端机省电调试）
        window.__KW_DPR_CAP = q > 0 ? q : Math.min(real, 3);
      } catch (e) { window.__KW_DPR_CAP = 2; }
    })();
  </script>

  <!-- 运行时错误浮层：手机端脚本异常直接显示在画面顶部（否则用户只见空画面无从反馈）。
       正常运行不出现任何内容；最多显示 3 条，每条截断 240 字符。 -->
  <script>
    (function () {
      var seen = 0;
      function show(msg) {
        try {
          if (seen >= 3) return;
          var box = document.getElementById('kwErrBox');
          if (!box) {
            box = document.createElement('div');
            box.id = 'kwErrBox';
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;pointer-events:none;'
              + 'font:12px/1.4 monospace;color:#ff9a9a;background:rgba(0,0,0,.72);padding:4px 6px;'
              + 'white-space:pre-wrap;word-break:break-all;max-height:40%;overflow:hidden;text-align:left;';
            (document.body || document.documentElement).appendChild(box);
          }
          seen++;
          box.textContent += (box.textContent ? '\n' : '') + '⚠ ' + String(msg).slice(0, 240);
        } catch (e) { /* ignore */ }
      }
      window.addEventListener('error', function (e) {
        show((e && (e.message || (e.error && e.error.message))) || 'unknown error');
      });
      window.addEventListener('unhandledrejection', function (e) { show('REJ: ' + (e && e.reason)); });
      var ce = console.error;
      console.error = function () {
        try { show([].join.call(arguments, ' ')); } catch (x) { /* ignore */ }
        ce.apply(console, arguments);
      };
    })();
  </script>

  <!-- 战斗渲染自诊断（真机“战斗空白”定位）：进入战斗后每 2s 把渲染状态（相机/实体/可视区）
       以绿字显示在画面顶部（点按可查看/复制），并通过 sendBeacon 同域回传到 /report
       （Pages Function 写 KV，远程 curl /report 读取）；主城不显示。定位完成后可整体移除本块。 -->
  <script>
    (function () {
      var lastT = 0, lastTxt = '', sentN = 0;
      setInterval(function () {
        try {
          var bd = window.__kw;
          var box = document.getElementById('kwDbgBox');
          if (!bd || !window.cc) { if (box) box.remove(); return; }
          var vis = cc.view.getVisibleSize();
          var cv = document.getElementById('GameCanvas');
          var ortho = null, camX = null, camY = null;
          var canvasNode = cc.director.getScene().getChildByName('Canvas');
          var c = canvasNode && canvasNode.getComponent('cc.Canvas');
          if (c && c.cameraComponent) {
            ortho = Math.round(c.cameraComponent.orthoHeight * 10) / 10;
            camX = Math.round(c.cameraComponent.node.worldPosition.x);
            camY = Math.round(c.cameraComponent.node.worldPosition.y);
          }
          var heroes = (bd.heroes || []).map(function (h) {
            return h.node ? Math.round(h.node.worldPosition.x) + ',' + Math.round(h.node.worldPosition.y) : '?';
          }).join('/');
          var lineY = bd.line && bd.line.node ? Math.round(bd.line.node.worldPosition.y) : '?';
          var mobs = bd.mgr && bd.mgr.list ? bd.mgr.list.filter(function (m) { return !m.dead; }).length : '?';
          var gpu = '';
          try { gpu = String(cc.director.root.pipeline.device._renderer || '').slice(0, 40); } catch (e) { /* ignore */ }
          var txt = 'KW ' + (bd.state || '?') + ' t' + Math.round(bd.elapsed || 0)
            + ' | dpr ' + (window.devicePixelRatio || 1) + (cv ? ' cv ' + cv.width + 'x' + cv.height : '')
            + ' | vis ' + Math.round(vis.width) + 'x' + Math.round(vis.height)
            + ' | ortho ' + ortho + ' cam ' + camX + ',' + camY
            + ' | lineY ' + lineY + ' hp ' + (bd.line ? Math.round(bd.line.hp) + '/' + Math.round(bd.line.maxHp) : '?')
            + ' | hero ' + heroes + ' | mobs ' + mobs
            + (gpu ? ' | gpu ' + gpu : '');
          if (!box) {
            box = document.createElement('div');
            box.id = 'kwDbgBox';
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99998;pointer-events:auto;'
              + 'font:10px/1.3 monospace;color:#9fe88a;background:rgba(0,0,0,.6);padding:3px 6px;'
              + 'white-space:pre-wrap;word-break:break-all;text-align:left;';
            (document.body || document.documentElement).appendChild(box);
          }
          box.textContent = txt;
          box.onclick = function () { try { prompt('KW 诊断（长按全选复制）', box.textContent); } catch (e) { /* ignore */ } };
          // 自动回传（KV 免费 1000 写/天）：内容变化≥8s 或 30s 心跳，单会话≤200 条
          try {
            var now = Date.now();
            if (sentN < 200 && ((txt !== lastTxt && now - lastT > 8000) || now - lastT > 30000)) {
              lastT = now; lastTxt = txt; sentN++;
              var full = txt + ' | ua ' + String(navigator.userAgent || '').slice(0, 80);
              if (navigator.sendBeacon) navigator.sendBeacon('/report', full);
              else fetch('/report', { method: 'POST', body: full, keepalive: true });
            }
          } catch (e) { /* ignore */ }
        } catch (e) { /* ignore */ }
      }, 2000);
    })();
  </script>
